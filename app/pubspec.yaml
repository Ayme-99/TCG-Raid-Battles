name: incursiones_app
description: App de tablet de Incursiones (el Game Master de la mesa).
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.8
  incursiones_engine:
    path: ../engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalogo/
    - assets/catalogo/bosses/
    - assets/catalogo/campana/pokemon/
    - assets/catalogo/campana/zonas/
    - assets/catalogo/campana/jefes/
    - assets/catalogo/campana/regiones/
    - assets/cartas/
    - assets/campana/cartas/
    - assets/campana/ui/
    - assets/campana/ui/iconos_tipo/
    - assets/mapas/
    - assets/jefes/
