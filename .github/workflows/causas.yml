name: Causas (temporal)
on:
  push:
    branches: [feat/sim-causas-invocacion]
jobs:
  causas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze bin/sim_jefes.dart
      - run: dart run bin/sim_jefes.dart --causas --informe=/tmp/x.csv
