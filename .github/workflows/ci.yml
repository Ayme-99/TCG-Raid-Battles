name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  engine:
    name: Motor (dart test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test

  sim:
    name: Simulador (compila y arranca)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze bin/sim_jefes.dart
      # Humo: una partida mínima con todos los jefes del catálogo. No mide nada.
      - run: dart run bin/sim_jefes.dart --equipos=3 --partidas=3 --informe=/tmp/jefes_aliados.csv
      - run: dart run bin/sim_jefes.dart --calibrar --equipos=3 --partidas=3 --informe=/tmp/jefes_calibrado.csv
      - run: dart run bin/sim_jefes.dart --animo=no --equipos=3 --partidas=3 --informe=/tmp/jefes_sin_animo.csv

  contrato:
    name: Contrato JSON (esquema del backend)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        env:
          MONGO_URL: mongodb://localhost:27017

  hoja:
    name: Hoja de balance al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python3 balance/scripts/comprobar_hoja.py

  app:
    name: App (flutter test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fijada: Flutter 3.50 declara obsoleto `package:flutter/material.dart`
          # y `flutter analyze` falla en toda la app. Se quita al migrar.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    name: App web (flutter build web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fijada: Flutter 3.50 declara obsoleto `package:flutter/material.dart`
          # y `flutter analyze` falla en toda la app. Se quita al migrar.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter build web --release

  experimento:
    name: Experimento temporal (menos jugadores)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {jug: 3, pok: 2, cal: 1}
          - {jug: 3, pok: 3, cal: 1}
          - {jug: 2, pok: 2, cal: 1}
          - {jug: 2, pok: 3, cal: 0}
          - {jug: 2, pok: 4, cal: 1}
          - {jug: 1, pok: 2, cal: 1}
          - {jug: 1, pok: 4, cal: 0}
          - {jug: 1, pok: 5, cal: 1}
          - {jug: 1, pok: 6, cal: 1}
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: |
          echo "== HP del catalogo, jugadores=${{ matrix.jug }} pokemon=${{ matrix.pok }}"
          dart run bin/sim_jefes.dart --jugadores=${{ matrix.jug }} --pokemon=${{ matrix.pok }} --equipos=150 --partidas=60 --informe=/tmp/x.csv
          if [ "${{ matrix.cal }}" = "1" ]; then
            echo "== calibrar, jugadores=${{ matrix.jug }} pokemon=${{ matrix.pok }}"
            dart run bin/sim_jefes.dart --calibrar --jugadores=${{ matrix.jug }} --pokemon=${{ matrix.pok }} --equipos=150 --partidas=60 --informe=/tmp/y.csv
          fi
