name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  engine:
    name: Motor (dart test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test
