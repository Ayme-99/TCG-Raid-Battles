name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  engine:
    name: Motor (dart test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test

  contrato:
    name: Contrato JSON (esquema del backend)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        env:
          MONGO_URL: mongodb://localhost:27017

  app:
    name: App (flutter test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    name: App web (flutter build web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # El repo no lleva las carpetas de plataforma: se generan aquí, solo
      # para comprobar que la app compila para web.
      - run: flutter create . --org dev.ayme99 --project-name incursiones_app --platforms=web
      - run: flutter pub get
      - run: flutter build web --release
